id: prereg-q7-book-release-effect
field: 2
title: Effect of the book release (Das vierte Feld, Band I) on AI citation behaviour
registered: 2026-09-15 (first version, release then planned for 2026-09-22; public log entry in the data-gap register, id 12)
re_dated: 2026-09-15 (release moved to 2026-10-08 before the event; register entry id 18)
hypothesis: |
  Retail availability creates, for the first time, machine-readable evidence maintained by third parties
  (retailer catalogues, library metadata, ISBN registers). Search-grounded models are expected to retrieve
  this evidence, so that the hit rate in the Direct channel (questions D1-D3) rises earlier than in the
  Recommendation channel (GR1-GR6), because recommendations additionally need reception signals.
null_hypothesis: No difference between the measurement windows.
intervention_date: 2026-10-08
windows:
  baseline: 2026-09-08 .. 2026-10-07 (anchor days of the three-day cadence)
  effect: 2026-10-08 .. 2026-11-07
  delayed_effects_observation: until 2027-01-06
metric: headline per anchor day plus the three channels Direct / Saga knowledge / Recommendation
analysis: before/after comparison with CUSUM baseline drift removed, so that a running trend is not read as an effect
unchanged: 16 fixed questions and three-day cadence
amendment_2026-10-07: |
  Fixed on 2026-10-07, BEFORE the event. Prompted by measurement changes that touch the original commitment
  "the provider panel is not adjusted"; justified by measurement problems, not by interim results
  (register entries claude_web 2026-09-16..2026-10-06, method_claude_modell, intervention_book_launch_amendment).
  (1) PRIMARY analysis only on providers with an unchanged panel since 2026-08-19: OpenAI search and Gemini;
      headline = simple mean of these two per anchor day, plus the three channels. Baseline as registered:
      Gemini on 10 anchor days, OpenAI on 6 (2026-09-09, -12, -15, -30, 2026-10-03, -06; outage 2026-09-18..27 registered).
      Hypothesis, null hypothesis and analysis unchanged.
  (2) Claude SECONDARY and descriptive only: from 2026-10-07 measured with the newest Opus model on claude.ai
      in an incognito chat; the earlier series (Haiku 4.5, Sonnet 4.6, Opus 4.8) is not comparable. Only baseline
      of the new configuration: one measurement on 2026-10-07 before release (outside the grid, for this purpose
      only), then anchor days from 2026-10-09. No significance judgement for Claude.
  (3) Early availability: paperback and hardcover orderable since 2026-09-30; official release and ebook on
      2026-10-08. A sensitivity baseline 2026-09-08..2026-09-29 without early availability is reported in addition.
  (4) No effect on the primary analysis from the scoring correction of 2026-10-07 (Claude rows only) or from
      showing the trend on anchor days only.
amendment2_2026-10-07: |
  Fixed on 2026-10-07, before the event and without effect data.
  (a) Correction to amendment point (4): the release-date fix in the scoring scheme (register entry
      method_scorer_termin) also touched OpenAI and Gemini (8 answers). The baseline could only be partly rescored
      (evidence from 500-character excerpts), the effect window is fully scored under the new rule, so the
      point-based Direct channel may be biased upwards.
  (b) Robustness metric added: HIT RATE = share of answers that correctly name the author (score > 0), per provider
      and channel; independent of the partial/full threshold. A Direct-channel effect is reported only if it appears
      in points AND in the hit rate.
  (c) Analysis details: baseline drift per provider = linear slope over all anchor days from 2026-08-19; effect per
      channel = mean of provider effects (OpenAI, Gemini), 95 % bootstrap over anchor days (10,000 draws, fixed seed);
      first deviation per channel = first alarm of a one-sided CUSUM (k = 0.5, h = 5) in the effect window.
      Last anchor day in the effect window: 2026-11-05.
amendment3_2026-10-07: |
  Fixed on 2026-10-07, before the event and before the first effect-window anchor day (2026-10-09), without effect data.
  Refines amendment2 (b): the Direct hit rate is already 92.2 % in the baseline (max. +7.8 pp possible, minimum
  detectable shift 15.7 pp), so "points AND hit rate significant" could never confirm a Direct increase. New: in the
  Direct channel the hit rate is a SIGN CHECK - a Direct effect in points is reported if its interval excludes zero and
  the hit-rate estimate has the same sign; a contradicting sign marks the effect as not robust. In all other channels
  the hit rate stays a full robustness metric.
amendment4_2026-10-15: |
  Fixed on 2026-10-15, DURING the effect window (after anchor days 2026-10-09, -12, -15), disclosed as such.
  Scoring correction found while reading answers: the scheme required the author name as a mandatory anchor, so an
  answer naming the book correctly without the author name scored 0. From now on the book or series title
  ("Das vierte Feld", "Prägungen des Reiches") also counts as an anchor when it is not part of the question (all
  questions except Direct; only D2 and D3 contain the title); the non-fiction book of the same title by another author
  remains a collision without points. Applied retroactively to all rows since 2026-08-19 under the same rule: two
  answers change, both on 2026-10-12, question L1 (Gemini 0 to 2; Claude Opus, descriptive only, 0 to 2). No baseline
  row is affected, so baseline and effect window are scored under the same rule. Register entry method_scorer_buchtitel.
correction_2026-11-08: |
  Dated correction, added on 2026-11-08 after a review of Report 04. The lines "registered" and "re_dated" above are
  kept unchanged; their dates do not match the record times in the public data-gap register. The first version was
  recorded on 2026-09-05 (entry id 12; release then planned for 2026-09-22). The release was moved publicly on
  2026-09-15 from 2026-09-22 to 2026-10-08. The re-dated version was recorded on 2026-09-23 (entry id 18), eight days
  after the public change of date. This file was added to the repository on 2026-10-07 together with amendments 1 to 3;
  amendment 4 followed on 2026-10-15. Both register entries predate the event on 2026-10-08, so the registration
  remains prior to the event.
extension_2026-11-08: |
  Recorded on 2026-11-08, AFTER the end of the effect window (2026-11-07); NOT pre-registered.
  The effect window closed on 2026-11-07 and its data pull was frozen on 2026-11-08. In addition to the pre-registered
  main analysis, Report 04 reports an extension of the effect window up to and including anchor day 2026-11-08.
  Reason: a decision by the author after the end of the effect window to include the Gemini measurement of that day.
  Gemini was missing on the last five anchor days of the effect window (2026-10-24 .. 2026-11-05, credit exhausted);
  these gaps are not re-measured. On 2026-11-08 OpenAI and Gemini were re-measured on the same day under the fixed
  catch-up rules (register entries method_openai_nachholung and method_gemini_nachholung). The extension rests on a
  separate data pull (cut-off 2026-11-08 23:59:59 UTC) and is scored under the pre-registered rules of this version;
  the frozen baseline and effect-window pulls stay unchanged. Hypothesis, null hypothesis, metrics, drift removal and
  decision rule are unchanged, and the hypotheses are decided by the main analysis alone (effect window as registered,
  last anchor day 2026-11-05). The extension is reported as a separately labelled sensitivity analysis.
  Register entry intervention_book_launch_extension (id 83).
report: Report 04, planned for 2026-11-07 (paper DE + EN, Zenodo DOI)
status: registered, effect window opens 2026-10-08
status_amendment_2026-11-08: >-
  Dated status note, added on 2026-11-08. The effect window closed on 2026-11-07 (last anchor day 2026-11-05);
  its data pull was frozen on 2026-11-08. Report 04 (paper DE + EN, Zenodo DOI) had not been released on
  2026-11-08. The delayed-effect observation runs until 2027-01-06 and will be reported descriptively as an
  addendum. The non-pre-registered extension to anchor day 2026-11-08 is described above. Original report and
  status lines above are kept unchanged.
